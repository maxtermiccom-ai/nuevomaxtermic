<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#061a2d" />
    <title>MAXTERMIC - Sin conexión</title>
    <style>
      :root {
        --bg: #020817;
        --panel: rgba(15, 23, 42, 0.92);
        --border: rgba(96, 165, 250, 0.28);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #00d2ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      .card {
        width: min(100%, 480px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 20px 60px rgba(0, 210, 255, 0.12);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: rgba(0, 210, 255, 0.12);
        border: 1px solid rgba(0, 210, 255, 0.35);
        color: var(--accent);
        font-size: 24px;
        margin-bottom: 18px;
      }
      h1 { margin: 0 0 10px; font-size: clamp(1.8rem, 3vw, 2.5rem); }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      .hint {
        margin-top: 20px;
        color: #cbd5e1;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div class="badge">M</div>
      <h1>Sin conexión</h1>
      <p>MAXTERMIC está listo para seguir funcionando parcialmente, pero algunas funciones requieren internet para actualizar información o datos en tiempo real.</p>
      <p class="hint">Cuando vuelva la conexión, la aplicación volverá a sincronizarse automáticamente.</p>
    </main>
  </body>
</html>
